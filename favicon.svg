<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 被剪切分离的背景碎屑（浮动的小块） -->
  <rect x="7" y="44" width="13" height="11" rx="2.5" fill="#ffffff" opacity="0.85"/>
  <rect x="30" y="6" width="9" height="8" rx="2" fill="#ffdf6b" opacity="0.9"/>
  <!-- 被抠出的主体人物剪影 -->
  <path d="M32 11c-4.6 0-8.3 3.4-8.3 8.1s3.7 8.1 8.3 8.1 8.3-3.4 8.3-8.1S36.6 11 32 11z" fill="#ffffff"/>
  <path d="M13.5 55c1.6-9.3 8.4-14.6 18.5-14.6S49 45.7 50.5 55z" fill="#ffffff"/>
  <!-- 剪切虚线：把主体从原背景中"剪"开 -->
  <line x1="52" y1="10" x2="12" y2="52" stroke="#ffdf6b" stroke-width="2.4" stroke-dasharray="4.5 3.5"
        stroke-linecap="round"/>
  <!-- 右上角小剪刀 -->
  <g transform="translate(45 15) rotate(-38)">
    <line x1="0" y1="-3.5" x2="13" y2="2.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="3.5" x2="13" y2="-2.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-4" r="2.3" fill="#ffdf6b"/>
    <circle cx="0" cy="4" r="2.3" fill="#ffdf6b"/>
  </g>
</svg>