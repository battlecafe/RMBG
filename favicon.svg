<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 被剪切剥离的背景碎屑（表示"抠出"） -->
  <rect x="7" y="41" width="16" height="16" rx="3" fill="#ffce3a"/>
  <!-- 被抠出的主体人物（大块白色，强对比、小尺寸也醒目） -->
  <circle cx="32" cy="21" r="13" fill="#ffffff"/>
  <path d="M13.5 59 C16 44 24 36 32 36 S48 44 50.5 59 Z" fill="#ffffff"/>
  <!-- 剪切虚线：把主体与背景碎屑"剪"开 -->
  <line x1="52" y1="13" x2="16" y2="49" stroke="#ffffff" stroke-width="2.3"
        stroke-dasharray="4 3.5" stroke-linecap="round"/>
  <!-- 底部一小块二次剥离的碎屑，强化"背景分离" -->
  <rect x="48" y="48" width="10" height="9" rx="2" fill="#ffffff" opacity="0.9"/>
</svg>