<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 外圈虚线放大剪影：原背景边缘轮廓被剪开、等待更换的印记 -->
  <g fill="none" stroke="#ffffff" stroke-width="1.7" stroke-dasharray="4.5 3" opacity="0.95">
    <circle cx="32" cy="22" r="18"/>
    <path d="M6 58 C10 42 20 33 32 33 S54 42 58 58 Z"/>
  </g>
  <!-- 左下角被剪切剥离的背景碎屑 -->
  <rect x="6" y="42" width="14" height="15" rx="3" fill="#ffce3a"/>
  <!-- 实心主体（被抠出的人） -->
  <circle cx="32" cy="22" r="12" fill="#ffffff"/>
  <path d="M15 58 C18 44 25 37 32 37 S46 44 49 58 Z" fill="#ffffff"/>
  <!-- 头部右侧小剪刀（抠图工具） -->
  <g transform="translate(43 12) rotate(-38) scale(0.62)">
    <line x1="0" y1="-3.5" x2="13" y2="2.5" stroke="#ffce3a" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="0" y1="3.5" x2="13" y2="-2.5" stroke="#ffce3a" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="0" cy="-4" r="2.4" fill="#ffce3a"/>
    <circle cx="0" cy="4" r="2.4" fill="#ffce3a"/>
  </g>
</svg>